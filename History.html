<style>
 body {
    height: 100%;
    width: 100%;
    margin: 0;
    padding: 0;
    font-family: "Poppins", Arial, sans-serif;
    text-align: center;
}


button {
  background-color: #67cdd8;
  color: rgb(69, 147, 154);
  padding: 12px 20px;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
}

div {
  position: relative;
  display: inline-block;
  margin: 0 10px;
}

div div {
  display: none;
  position: absolute;
  background-color: rgb(255, 255, 255);
  border-radius: 6px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.15);
  min-width: 160px;
  text-align: left;
}

a {
  color: #333;
  padding: 10px 15px;
  display: block;
  text-decoration: none;
}

a:hover {
  background-color: #f2f2f2;
}

/* Show dropdown when hovering over menu */
div:hover div {
  display: block;
}

/* Change button color when hovered */
div:hover button {
  background-color: #0073a6;
}
</style>
